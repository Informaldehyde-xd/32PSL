name: Extract Unity assets

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag that holds the APK"
        required: true
      apk:
        description: "APK file name"
        required: true
      obb:
        description: "OBB file name (leave empty if the game has none)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Download the APK (and OBB) from the private release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          APK: ${{ inputs.apk }}
          OBB: ${{ inputs.obb }}
        run: |
          gh release download "$TAG" --repo "${{ github.repository }}" --pattern "$APK"
          if [ -n "$OBB" ]; then
            gh release download "$TAG" --repo "${{ github.repository }}" --pattern "$OBB"
          fi

      - name: Unpack
        env:
          APK: ${{ inputs.apk }}
          OBB: ${{ inputs.obb }}
        run: |
          mkdir -p game
          unzip -q -o "$APK" -d game
          if [ -n "$OBB" ]; then
            mkdir -p game/obb
            unzip -q -o "$OBB" -d game/obb || cp "$OBB" game/obb/
          fi
          {
            echo "## Unpacked game"
            echo '```'
            ls game/assets/bin/Data 2>/dev/null | head -40
            echo '```'
            echo "files: $(find game -type f | wc -l)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Get AssetRipper (Linux x64 only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ar
          echo "Release assets:"
          gh release view --repo AssetRipper/AssetRipper --json assets -q '.assets[].name'
          gh release download --repo AssetRipper/AssetRipper --pattern '*linux_x64*' --dir ar
          cd ar
          ls -la
          find . -maxdepth 1 -name '*.zip' -exec unzip -q -o {} \;
          find . -maxdepth 1 \( -name '*.tar.gz' -o -name '*.tgz' \) -exec tar -xzf {} \;
          find . -maxdepth 1 -name '*.tar.xz' -exec tar -xJf {} \;
          BIN=$(find . -type f -name 'AssetRipper.GUI.Free' | head -1)
          if [ -z "$BIN" ]; then echo "AssetRipper program not found:"; ls -R . | head -50; exit 1; fi
          chmod +x "$BIN"
          file "$BIN" || true
          echo "$BIN" > ../ar-bin.txt

      - name: Export Unity project
        run: |
          BIN="$PWD/ar/$(cat ar-bin.txt)"
          OUT="$PWD/out"
          BASE=http://127.0.0.1:5000
          mkdir -p "$OUT" diag

          # Start AssetRipper without a browser (options confirmed by its own usage text)
          "$BIN" --headless --port 5000 > ar.log 2>&1 &
          AR_PID=$!
          up=0
          for i in $(seq 1 90); do
            if curl -s -o /dev/null "$BASE/"; then up=1; break; fi
            kill -0 "$AR_PID" 2>/dev/null || break
            sleep 2
          done
          if [ "$up" -ne 1 ]; then echo "AssetRipper did not start:"; cat ar.log; exit 1; fi
          echo "AssetRipper is up"

          # Save the server's own documentation pages for diagnosis
          for p in /Commands /swagger/v1/swagger.json /openapi/v1.json /; do
            f="diag/page$(echo "$p" | tr '/' '_').txt"
            code=$(curl -s -o "$f" -w '%{http_code}' "$BASE$p" || true)
            echo "GET $p -> HTTP $code"
          done

          count() { find "$OUT" -type f | wc -l; }
          post() {
            local ep="$1"; shift
            local code
            code=$(curl -s -o resp.txt -w '%{http_code}' --max-time 3300 -X POST "$BASE$ep" "$@") || code="curl-failed"
            echo "POST $ep $* -> HTTP $code"
            head -c 800 resp.txt || true
            echo
          }

          # Try loading the whole unpacked APK, then just the Unity data folder
          for LOADPATH in "$PWD/game" "$PWD/game/assets/bin/Data"; do
            echo "=== Loading $LOADPATH"
            post /Reset
            post /LoadFolder --data-urlencode "Path=$LOADPATH"
            sleep 5
            for variant in 1 2 3; do
              case $variant in
                1) post /Export/UnityProject --data-urlencode "Path=$OUT" --data-urlencode "CreateSubfolder=false" ;;
                2) post /Export/UnityProject --data-urlencode "Path=$OUT" ;;
                3) post "/Export/UnityProject?Path=$OUT" ;;
              esac
              if [ "$(count)" -gt 0 ]; then break 2; fi
            done
          done

          # Second export: Primary Content (plain PNG / audio / GLB model files for Godot)
          OUT2="$PWD/out-primary"
          mkdir -p "$OUT2"
          for variant in 1 2 3; do
            case $variant in
              1) post /Export/PrimaryContent --data-urlencode "Path=$OUT2" --data-urlencode "CreateSubfolder=false" ;;
              2) post /Export/PrimaryContent --data-urlencode "Path=$OUT2" ;;
              3) post "/Export/PrimaryContent?Path=$OUT2" ;;
            esac
            if [ "$(find "$OUT2" -type f | wc -l)" -gt 0 ]; then break; fi
          done
          PRIMARY_COUNT=$(find "$OUT2" -type f | wc -l)
          echo "primary content files: $PRIMARY_COUNT"
          {
            echo "## Primary Content (for Godot)"
            echo "files exported: $PRIMARY_COUNT"
            echo "size: $(du -sh "$OUT2" | cut -f1)"
          } >> "$GITHUB_STEP_SUMMARY"

          kill "$AR_PID" 2>/dev/null || true

          {
            echo "## Export"
            echo "files exported: $(count)"
            echo "size: $(du -sh "$OUT" | cut -f1)"
            echo
            echo "Top folders:"
            echo '```'
            find "$OUT" -maxdepth 3 -type d | head -30
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$(count)" -eq 0 ]; then
            echo "Nothing was exported. AssetRipper log (tail):"
            tail -60 ar.log
            echo "Server command page (head):"
            head -c 3000 diag/page_Commands.txt || true
            exit 1
          fi

      - name: Save the exported project
        uses: actions/upload-artifact@v4
        with:
          name: unity-project
          path: out
          retention-days: 3
          if-no-files-found: warn

      - name: Save Primary Content (for Godot)
        uses: actions/upload-artifact@v4
        with:
          name: primary-content
          path: out-primary
          retention-days: 3
          if-no-files-found: warn

      - name: Save logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            ar.log
            resp.txt
            diag
          if-no-files-found: ignore
