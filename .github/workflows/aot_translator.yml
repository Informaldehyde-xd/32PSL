name: AOT Translate All Libs (RetDec)

on:
  workflow_dispatch:

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 60 # Reduced timeout because these files are tiny

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install RetDec Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y upx graphviz

      - name: Download and Extract RetDec v4.0
        run: |
          wget https://github.com/avast/retdec/releases/download/v4.0/retdec-v4.0-ubuntu-64b.tar.xz
          tar -xf retdec-v4.0-ubuntu-64b.tar.xz
          echo "Extracted contents:"
          ls -l

      - name: Locate the Decompiler Binary
        id: find_retdec
        run: |
          DECOMPILER_PATH=$(find . -type f -name 'retdec-decompiler.py' | head -n 1)
          if [ -z "$DECOMPILER_PATH" ]; then
            echo "Error: Could not find retdec-decompiler.py"
            exit 1
          fi
          echo "Found decompiler at: $DECOMPILER_PATH"
          echo "decompiler_path=$DECOMPILER_PATH" >> "$GITHUB_OUTPUT"

      - name: Decompile All .so Files in libs/
        run: |
          chmod +x "${{ steps.find_retdec.outputs.decompiler_path }}"
          
          # Loop through every .so file in the libs folder
          for file in libs/*.so; do
            if [ -f "$file" ]; then
              echo "=================================================="
              echo "Decompiling: $file"
              echo "=================================================="
              
              # Run RetDec on the file
              python3 "${{ steps.find_retdec.outputs.decompiler_path }}" --no-memory-limit "$file"
              
              echo "Finished decompiling $file"
            fi
          done

      - name: Upload LLVM IR and C Outputs
        uses: actions/upload-artifact@v4
        with:
          name: all-libs-aot-output
          # This grabs every generated .ll, .c, and .dsm file in the libs folder
          path: |
            libs/*.ll
            libs/*.c
            libs/*.dsm
          retention-days: 7
