name: AOT Translate Jade Empire (RetDec)

on:
  workflow_dispatch:

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # Increased to 6 hours (GitHub max) since 8MB will take a long time

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install RetDec Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y upx graphviz

      - name: Download and Extract RetDec v4.0
        run: |
          wget https://github.com/avast/retdec/releases/download/v4.0/retdec-v4.0-ubuntu-64b.tar.xz
          tar -xf retdec-v4.0-ubuntu-64b.tar.xz
          echo "Extracted contents:"
          ls -l

      - name: Locate the Decompiler Binary
        id: find_retdec
        run: |
          DECOMPILER_PATH=$(find . -type f -name 'retdec-decompiler.py' | head -n 1)
          if [ -z "$DECOMPILER_PATH" ]; then
            echo "Error: Could not find retdec-decompiler.py"
            exit 1
          fi
          echo "Found decompiler at: $DECOMPILER_PATH"
          echo "decompiler_path=$DECOMPILER_PATH" >> "$GITHUB_OUTPUT"

      - name: Decompile libJadeEmpireCore.so (Large File)
        run: |
          chmod +x "${{ steps.find_retdec.outputs.decompiler_path }}"
          # Limit to 6GB RAM (6,000,000 KB) to prevent OOMKilled on GitHub's 7GB runner
          ulimit -v 6000000
          
          # Run the decompiler
          python3 "${{ steps.find_retdec.outputs.decompiler_path }}" --no-memory-limit libs/libJadeEmpireCore.so

      - name: Upload LLVM IR and C Outputs
        uses: actions/upload-artifact@v4
        with:
          name: jade-empire-aot-output
          path: |
            libs/*.ll
            libs/*.c
            libs/*.dsm
          retention-days: 7
