name: Inspect Unity APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag that holds the APK"
        required: true
      apk:
        description: "APK file name (exactly as uploaded)"
        required: true

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Download APK from the private release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          APK: ${{ inputs.apk }}
        run: gh release download "$TAG" --repo "${{ github.repository }}" --pattern "$APK"

      - name: Inspect
        env:
          APK: ${{ inputs.apk }}
        run: |
          unzip -q -o "$APK" -d apk
          {
            echo "## Report for $APK"
            echo
            echo "### CPU folders in lib/"
            ls apk/lib 2>/dev/null || echo "none found"
            echo
            echo "### Engine type"
            if [ -f apk/lib/armeabi-v7a/libil2cpp.so ]; then echo "IL2CPP (code is compiled to native, library swap will NOT work)"; fi
            if [ -f apk/lib/armeabi-v7a/libmono.so ]; then echo "Mono (game code is portable, library swap may work)"; fi
            echo
            echo "### Unity version"
            grep -aoE '[0-9]{1,4}\.[0-9]+\.[0-9]+[fpb][0-9]+' apk/assets/bin/Data/globalgamemanagers apk/assets/bin/Data/mainData 2>/dev/null | head -2 || true
            echo
            echo "### 32-bit libraries with NO 64-bit twin (these are the blockers)"
            for f in $(ls apk/lib/armeabi-v7a 2>/dev/null); do
              [ -e "apk/lib/arm64-v8a/$f" ] || echo "- $f"
            done
            echo
            echo "### Everything in lib/"
            find apk/lib -name '*.so' | sort
          } >> "$GITHUB_STEP_SUMMARY"
