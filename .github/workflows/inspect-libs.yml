name: Inspect Unity libs

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag that holds the zip"
        required: true
      zip:
        description: "Zip file name (a zip of the lib folder)"
        required: true

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Download zip from the private release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          ZIP: ${{ inputs.zip }}
        run: gh release download "$TAG" --repo "${{ github.repository }}" --pattern "$ZIP"

      - name: Inspect
        env:
          ZIP: ${{ inputs.zip }}
        run: |
          unzip -q -o "$ZIP" -d libs
          V7=$(find libs -type d -name armeabi-v7a | head -1)
          ROOT=$(dirname "${V7:-libs/x}")
          {
            echo "## Report for $ZIP"
            echo
            echo "### CPU folders found"
            ls "$ROOT" 2>/dev/null || echo "none found"
            echo
            echo "### Engine type"
            if find libs -name libil2cpp.so | grep -q .; then echo "IL2CPP (game code is native 32-bit, a library swap will NOT work)"; fi
            if find libs -name libmono.so | grep -q .; then echo "Mono (game code is portable, a library swap may work)"; fi
            echo
            echo "### Unity version (read from libunity.so)"
            U=$(find libs -name libunity.so | head -1)
            if [ -n "$U" ]; then
              grep -aoE '[0-9]{1,4}\.[0-9]+\.[0-9]+[fpb][0-9]+' "$U" | sort -u | head -3
            else
              echo "libunity.so not found"
            fi
            echo
            echo "### 32-bit libraries with NO 64-bit twin (blockers)"
            for f in $(ls "$V7" 2>/dev/null); do
              [ -e "$ROOT/arm64-v8a/$f" ] || echo "- $f"
            done
            echo
            echo "### All libraries"
            find libs -name '*.so' | sort
          } >> "$GITHUB_STEP_SUMMARY"
